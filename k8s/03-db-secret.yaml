# ==============================================================
#  03-db-secret.yaml
#  Paso 4: Proteccion de Credenciales Sensibles (Secret)
#  Almacena las credenciales de MongoDB de forma segura.
#  Los valores DEBEN estar codificados en Base64.
#  Generados con: echo -n 'valor' | base64
#
#  admin     -> YWRtaW4=
#  admin123  -> YWRtaW4xMjM=
# ==============================================================
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: practica-s11
  labels:
    app: mongodb
    proyecto: hotel-citas
type: Opaque
data:
  # echo -n 'admin' | base64
  MONGO_INITDB_ROOT_USERNAME: YWRtaW4=

  # echo -n 'admin123' | base64
  MONGO_INITDB_ROOT_PASSWORD: YWRtaW4xMjM=
