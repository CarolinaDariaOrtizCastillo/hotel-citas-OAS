# ============================================================
#  Hotel Citas - Configuracion de la Aplicacion
# ============================================================

# Puerto del servidor (sobreescrito por ConfigMap en K8s)
server.port=${APP_PORT:8080}

# --- Conexion a MongoDB (valores inyectados desde K8s) ---
spring.data.mongodb.host=${DB_HOST:localhost}
spring.data.mongodb.port=${DB_PORT:27017}
spring.data.mongodb.database=${DB_NAME:hoteldb}
spring.data.mongodb.username=${MONGO_INITDB_ROOT_USERNAME:admin}
spring.data.mongodb.password=${MONGO_INITDB_ROOT_PASSWORD:admin123}
spring.data.mongodb.authentication-database=admin

# --- Actuator (Health Probes para Kubernetes) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- Nombre de la app ---
spring.application.name=hotel-citas
